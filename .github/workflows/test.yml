name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          COVER_PKGS=$(go list ./internal/... | grep -v testutil | paste -sd, -)
          mapfile -t TEST_PKGS < <(go list ./internal/... | grep -v testutil)
          gotestsum --junitfile test-results/report.xml --format testname -- \
            -coverpkg="$COVER_PKGS" -coverprofile=coverage.out "${TEST_PKGS[@]}"

      - name: Generate PR coverage report
        if: github.event_name == 'pull_request' && always()
        run: |
          set -euo pipefail
          if [ ! -f coverage.out ]; then
            echo "coverage.out missing; skipping report generation"
            exit 0
          fi
          REPORT_ARGS=(
            --coverprofile=coverage.out
            --junit=test-results/report.xml
            --output=coverage-report.md
            --commit="${{ github.sha }}"
          )
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            REPORT_ARGS+=(--summary-only)
          else
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
            git ls-tree -r --name-only "origin/${{ github.event.pull_request.base.ref }}" -- internal/ \
              | grep '\.go$' \
              | grep -v '/testutil/' \
              | grep -v '/examples/' \
              | xargs -n1 dirname \
              | sort -u > trusted-packages.txt
            REPORT_ARGS+=(--allowed-packages-file trusted-packages.txt)
          fi
          python3 scripts/generate_pr_coverage_report.py "${REPORT_ARGS[@]}"

      - name: Post coverage report to PR
        if: github.event_name == 'pull_request' && always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-tag: coverage-pr-report
          body-path: coverage-report.md

      - name: Publish test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/report.xml
          check_name: Go Test Report
          comment_title: Go Test Report
          comment_mode: always

      - name: Show coverage summary
        if: always()
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-report.md

  update-coverage-badge:
    name: Update Coverage Badge
    needs: test
    # Only run once a PR is merged (or a commit is otherwise pushed) to
    # main/master - never on pull_request events (opened, synchronize, etc.)
    # - and only if the test job actually succeeded. A custom `if` on a job
    # with `needs` does not implicitly require success(), so it must be
    # listed explicitly here.
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download coverage report
        uses: actions/download-artifact@v4.1.3
        with:
          name: coverage-report

      - name: Regenerate scoped coverage report
        run: |
          set -euo pipefail
          COVER_PKGS=$(go list ./internal/... | grep -v testutil | paste -sd, -)
          mapfile -t TEST_PKGS < <(go list ./internal/... | grep -v testutil)
          go test -coverpkg="$COVER_PKGS" -coverprofile=coverage.out "${TEST_PKGS[@]}"

      - name: Generate coverage badge
        run: |
          pct=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          hex=$(awk -v p="$pct" 'BEGIN {
            if (p >= 80) print "#4c1";
            else if (p >= 60) print "#dfb317";
            else print "#e05d44";
          }')
          label="coverage"
          message="${pct}%"
          label_width=$(( ${#label} * 7 + 20 ))
          message_width=$(( ${#message} * 7 + 20 ))
          total_width=$(( label_width + message_width ))
          label_x=$(( label_width / 2 ))
          message_x=$(( label_width + message_width / 2 ))

          mkdir -p .github/badges
          cat > .github/badges/coverage.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="${total_width}" height="20" role="img" aria-label="${label}: ${message}">
            <title>${label}: ${message}</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="${total_width}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="${label_width}" height="20" fill="#555"/>
              <rect x="${label_width}" width="${message_width}" height="20" fill="${hex}"/>
              <rect width="${total_width}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="${label_x}" y="14">${label}</text>
              <text x="${message_x}" y="14">${message}</text>
            </g>
          </svg>
          SVG

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          if git diff --cached --quiet; then
            echo "Coverage unchanged, nothing to commit."
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
